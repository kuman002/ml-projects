<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Performance Indicator</title>
<style>
    /* --- GLOBAL STYLES --- */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #a18cd1, #fbc2eb, #fad0c4, #ffd1ff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    /* --- CONTAINER --- */
    .login {
        background: rgba(255,255,255,0.95);
        padding: 35px 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        width: 420px;
        max-width: 90%;
        text-align: center;
        animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(15px);}
        to {opacity: 1; transform: translateY(0);}
    }

    /* --- HEADINGS --- */
    h1 {
        font-size: 1.6rem;
        color: #333;
        margin-bottom: 20px;
    }

    legend {
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 15px;
        color: #555;
        display: block;
        text-align: center;
    }

    h2 {
        font-size: 1.2rem;
        color: #444;
        margin-top: 20px;
    }

    /* --- FORM ELEMENTS --- */
    form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: left;
    }

    label {
        font-weight: 500;
        color: #333;
        margin-bottom: 5px;
        display: block;
    }

    .form-control {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #6a11cb;
        box-shadow: 0 0 6px rgba(106,17,203,0.2);
        outline: none;
    }

    .btn {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .btn:hover {
        background: linear-gradient(135deg, #2575fc, #6a11cb);
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    select option.placeholder {
        color: #aaa;
    }

    /* --- RESULT BOX --- */
    .result-box {
        background: #f1f3ff;
        border: 1px solid #d0d6ff;
        padding: 12px;
        border-radius: 12px;
        color: #333;
        font-weight: 600;
        margin-top: 15px;
        text-align: center;
        animation: fadeIn 1s ease;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 480px) {
        .login {
            width: 90%;
            padding: 25px 20px;
        }

        h1 {
            font-size: 1.4rem;
        }

        .btn {
            font-size: 0.95rem;
            padding: 10px;
        }
    }
</style>
</head>

<body>
    <div class="login">
        <h1>Student Exam Performance Indicator</h1>
        <form action="{{ url_for('predict_datapoint')}}" method="POST">
            <legend>Student Exam Performance Prediction</legend>

            <div class="mb-3">
                <label>Gender</label>
                <select class="form-control" name="gender" required>
                    <option class="placeholder" selected disabled value="">Select your Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Race or Ethnicity</label>
                <select class="form-control" name="ethnicity" required>
                    <option class="placeholder" selected disabled value="">Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Parental Level of Education</label>
                <select class="form-control" name="parental_level_of_education" required>
                    <option class="placeholder" selected disabled value="">Select Parent Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Lunch Type</label>
                <select class="form-control" name="lunch" required>
                    <option class="placeholder" selected disabled value="">Select Lunch Type</option>
                    <option value="free/reduced">Free/Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Test Preparation Course</label>
                <select class="form-control" name="test_preparation_course" required>
                    <option class="placeholder" selected disabled value="">Select Course</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Writing Score (out of 100)</label>
                <input class="form-control" type="number" name="reading_score"
                       placeholder="Enter your Reading Score" min="0" max="100" required>
            </div>

            <div class="mb-3">
                <label>Reading Score (out of 100)</label>
                <input class="form-control" type="number" name="writing_score"
                       placeholder="Enter your Writing Score" min="0" max="100" required>
            </div>

            <div class="mb-3">
                <input class="btn" type="submit" value="Predict your Maths Score">
            </div>
        </form>

        {% if result %}
        <div class="result-box">
            🎯 Prediction: {{ result }}
        </div>
        {% endif %}
    </div>
</body>
</html>
